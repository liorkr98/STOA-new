name: Cap Vercel on-demand spend

# Applies the $1 team on-demand budget (pause at 100%) and attaches the
# #ops webhook. Safe to re-run: if the cap is already in place, the script
# exits without rotating the webhook secret.

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/set-vercel-spend-cap.mjs"
      - ".github/workflows/vercel-spend-cap.yml"
  workflow_dispatch:

jobs:
  cap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Set $1 on-demand budget with pause
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/set-vercel-spend-cap.mjs
