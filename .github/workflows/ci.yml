name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Colour and type law
        run: npm run test:contrast

      - name: Valuation tests
        run: npm run test:valuation

      - name: Ranking tests
        run: npm run test:ranking

      # The Interest Cart ships dark behind FEATURE_INTEREST_CART. Both states
      # run here until launch, when the flag and the off-state suite go.
      - name: Media link tests
        run: npm run test:media

      # The signed-out wall (FEATURE_GATED_SITE), both states, as for the cart.
      - name: Signed-out wall tests (flag on)
        run: npm run test:gated

      - name: Signed-out wall tests (flag off)
        run: npm run test:gated-off

      - name: Back navigation tests (Interest Cart on)
        run: npm run test:nav
        env:
          FEATURE_INTEREST_CART: "on"

      - name: Interest Cart tests (flag on)
        run: npm run test:cart

      - name: Interest Cart off-state tests (flag off)
        run: npm run test:cart-off

      - name: RLS tests
        # Skips cleanly when Supabase secrets are absent (see tests/rls).
        run: npm run test:rls
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          RLS_TEST_PASSWORD: ${{ secrets.RLS_TEST_PASSWORD }}

      - name: Build
        run: npm run build
        env:
          # Placeholders so Next.js build succeeds without Vercel pull.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: https://stoa.app

      - name: Interest Cart stays out of eager page code
        run: npm run check:cart-bundle

  # The wall end to end: a build with FEATURE_GATED_SITE=on (the sitemap is
  # generated at build time, as on Vercel), served and requested signed out.
  gated-site:
    runs-on: ubuntu-latest
    env:
      FEATURE_GATED_SITE: "on"
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_PUBLIC_SITE_URL: https://stoa.app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with the wall on
        run: npm run build

      - name: Signed out, nothing behind the wall is served
        run: |
          npx next start -p 3000 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/about && break; sleep 2; done
          node scripts/check-gated-site.mjs http://localhost:3000
