name: Vercel Production Deploy

# Manual deploy only. Production deploys on push should come from Vercel's GitHub
# integration (Project → Settings → Git). To use this workflow instead, add secrets:
#   VERCEL_TOKEN, VERCEL_ORG_ID  (+ optional VERCEL_PROJECT_ID)
# then run from Actions → "Vercel Production Deploy" → Run workflow.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: false
        default: main

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: prj_S05cHjfIQVLDIygss1VM6CZuNIC0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Require Vercel secrets
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ]; then
            echo "::error::Missing VERCEL_TOKEN or VERCEL_ORG_ID in GitHub repo secrets."
            echo "Add them at Settings → Secrets and variables → Actions"
            echo "Or connect the repo in the Vercel dashboard for automatic deploys on push."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel env
        run: npx vercel@55 pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        run: npx vercel@55 build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt
        run: npx vercel@55 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
