name: Vercel Production Deploy

# Production ships only after CI has passed on that exact commit. Vercel's own
# deploy-on-push for main is off (vercel.json, git.deploymentEnabled.main =
# false), so this workflow is the only way main reaches production:
#   - automatically, when the CI run for a push to main completes successfully
#     and that commit is still main's newest (a newer commit waits for its own
#     CI run);
#   - by hand (Run workflow), which checks the same thing first.
# It deploys through the Vercel Deploy Hook for main (VERCEL_DEPLOY_HOOK).

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    # Only after a green CI run (or a manual run, which checks CI itself below).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: prj_S05cHjfIQVLDIygss1VM6CZuNIC0
    steps:
      - name: Main's newest commit has passed CI
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/${{ github.repository }}/commits/main" -q .sha)
          if [ -n "$RUN_SHA" ] && [ "$RUN_SHA" != "$head" ]; then
            echo "::notice::CI passed for ${RUN_SHA:0:7}, but main has moved on to ${head:0:7}; that commit deploys after its own CI run."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ci=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$head&per_page=1" -q '.workflow_runs[0].conclusion // "none"')
          if [ "$ci" != "success" ]; then
            echo "::error::CI for main's newest commit ${head:0:7} is '$ci', not success. Not deploying."
            exit 1
          fi
          echo "CI passed for ${head:0:7}. Deploying."
          echo "go=true" >> "$GITHUB_OUTPUT"

      - name: Decide deploy method
        id: plan
        run: |
          if [ "${{ steps.guard.outputs.go }}" != "true" ]; then
            echo "method=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$DEPLOY_HOOK" ]; then
            echo "method=hook" >> "$GITHUB_OUTPUT"
          elif [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ]; then
            echo "method=cli" >> "$GITHUB_OUTPUT"
          else
            echo "method=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Vercel deploy hook
        if: steps.plan.outputs.method == 'hook'
        run: |
          echo "Triggering Vercel deploy hook..."
          curl -fsS -X POST "$DEPLOY_HOOK"
          echo "Production deploy triggered."

      - uses: actions/checkout@v7
        if: steps.plan.outputs.method == 'cli'

      - uses: actions/setup-node@v7
        if: steps.plan.outputs.method == 'cli'
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        if: steps.plan.outputs.method == 'cli'
        run: npm ci

      - name: Pull Vercel env
        if: steps.plan.outputs.method == 'cli'
        run: npx vercel@55 pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        if: steps.plan.outputs.method == 'cli'
        run: npx vercel@55 build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt
        if: steps.plan.outputs.method == 'cli'
        run: npx vercel@55 deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Setup instructions
        if: steps.plan.outputs.method == 'none'
        run: |
          echo "::error::No Vercel deploy credentials configured."
          echo ""
          echo "Recommended (works when Git webhooks don't):"
          echo "  1. Vercel → stoa-new → Settings → Git → Deploy Hooks"
          echo "  2. Create hook named 'github-main' for branch 'main'"
          echo "  3. GitHub → liorkr98/STOA-new → Settings → Secrets → Actions"
          echo "  4. Add secret VERCEL_DEPLOY_HOOK = the hook URL"
          echo ""
          echo "Alternative: add VERCEL_TOKEN + VERCEL_ORG_ID for CLI deploy."
          echo ""
          echo "If Git integration should work but doesn't, check Vercel:"
          echo "  • Production branch = main"
          echo "  • Deployments not paused"
          echo "  • GitHub app has access to liorkr98/STOA-new"
          exit 1
